<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="一张会吹蜡烛的生日贺卡">
<meta name="theme-color" content="#f4f3ee">
<title>生日快乐，徐赫 🎂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<style>
/* ============================================================
   Claude (Anthropic) — Warm Editorial 风格
   奶油纸底 #f4f3ee · 赤陶点睛 #c96442 · 墨黑文字 #191817
   规则：平铺无阴影、单一强调色、衬线标题 + 人文无衬线正文
   ============================================================ */
:root{
  /* Claude 官方 token */
  --bg-primary:#f4f3ee;   /* cream, page */
  --bg-secondary:#eeede6; /* subtle surface lift */
  --bg-inverse:#191817;   /* near-black */
  --text-primary:#191817; /* ink */
  --text-secondary:#5a554e;
  --text-muted:#8a847a;
  --accent:#c96442;       /* terracotta */
  --accent-hover:#b55738;
  --accent-soft:#e89268;
  --border:#d8d3c8;
  --success:#6b7a3d;
  --warning:#c98a42;

  /* 派生 */
  --hairline:#e2ddd1;
  --accent-wash:#f7e6dd;
  --cream:#fbf6ec;
  --choco:#a05a3c;
  --choco-d:#7d4229;

  /* 字体：衬线标题 + 人文无衬线正文 */
  --serif:"Tiempos Headline","Iowan Old Style","Songti SC","Source Han Serif SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  --sans:"Styrene A",Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;

  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--sans);
  font-size:17px;
  line-height:1.6;
  color:var(--text-primary);
  background:var(--bg-primary);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  text-wrap:pretty;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

/* ============ 奶油纸张背景（平铺，无渐变堆叠） ============ */
.sky{
  position:fixed;inset:0;z-index:0;
  background:var(--bg-primary);
}
/* 极淡的纸张纤维纹理：用两层点状噪点模拟，不做发光 */
.sky::before{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(1.4px 1.4px at 18% 24%, rgba(25,24,23,.055) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 62% 12%, rgba(25,24,23,.045) 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 84% 46%, rgba(25,24,23,.05) 50%, transparent 51%),
    radial-gradient(1.1px 1.1px at 32% 68%, rgba(25,24,23,.045) 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 74% 82%, rgba(25,24,23,.05) 50%, transparent 51%),
    radial-gradient(1px 1px at 44% 40%, rgba(25,24,23,.04) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 92% 20%, rgba(25,24,23,.04) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 8% 90%, rgba(25,24,23,.045) 50%, transparent 51%);
  pointer-events:none;
}
/* 右下角一处极淡的赤陶晕染，作为唯一暖色氛围（不算渐变滥用） */
.sky::after{
  content:"";position:absolute;right:-14vw;bottom:-18vh;
  width:62vw;height:62vw;border-radius:50%;
  background:radial-gradient(circle,rgba(201,100,66,.07) 0%,rgba(201,100,66,.03) 42%,transparent 70%);
  pointer-events:none;
}

/* ============ 布局 ============ */
.stage{
  position:relative;z-index:1;
  min-height:100dvh;
  display:grid;place-items:center;
  padding:clamp(20px,5vw,56px);
}

/* ============ 封面 ============ */
.cover{
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(20px,4.5vw,34px);
  max-width:680px;
  transition:opacity .55s var(--ease),transform .55s var(--ease);
}
.cover.gone{opacity:0;transform:translateY(-18px);pointer-events:none;}

/* 信封：奶油卡纸 + 1px 边框，平面质感 */
.envelope{
  width:clamp(200px,54vw,320px);
  aspect-ratio:3/2;
  position:relative;
  border-radius:8px;
  background:var(--cream);
  border:1px solid var(--border);
  animation:float 5.2s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.envelope::before{ /* 信封下摆折线 */
  content:"";position:absolute;inset:0;border-radius:8px;
  background:
    linear-gradient(200deg,transparent 44%,var(--bg-secondary) 44.6%,var(--bg-secondary) 45.4%,transparent 46%);
  clip-path:polygon(0 100%,50% 52%,100% 100%);
}
/* 火漆印：唯一的赤陶色块 */
.envelope::after{
  content:"";position:absolute;left:50%;top:52%;
  transform:translate(-50%,-50%);
  width:clamp(46px,12vw,60px);aspect-ratio:1;border-radius:50%;
  background:var(--accent);
  border:3px solid var(--bg-primary);
  box-shadow:0 0 0 1px var(--accent);
}
/* 印上的心形，用文字层单独放，避免 ::after 被占用 */
.seal-heart{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  color:var(--bg-primary);font-size:clamp(18px,4.6vw,24px);line-height:1;
  z-index:2;pointer-events:none;
}

.eyebrow{
  margin:0;
  font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text-muted);
}
.cover h1{
  margin:0;
  font-family:var(--serif);
  font-size:clamp(38px,9vw,62px);
  font-weight:500;
  letter-spacing:-.015em;
  line-height:1.14;
  color:var(--text-primary);
  text-wrap:balance;
  max-width:12em;
}
.cover h1 em{
  font-style:normal;
  color:var(--accent);
}
.cover .lede{
  margin:0;color:var(--text-secondary);
  font-size:clamp(15px,3.8vw,17px);line-height:1.7;max-width:26em;
}
.hint{
  color:var(--text-muted);font-size:13px;letter-spacing:.14em;margin:0;
  display:inline-flex;align-items:center;gap:.5em;
}
.hint::after{
  content:"";width:1px;height:26px;background:var(--border);
  animation:tick 2.1s ease-in-out infinite;
}
@keyframes tick{0%,100%{opacity:.3;transform:scaleY(.6);}50%{opacity:1;transform:scaleY(1);}}

/* ============ 贺卡主体 ============ */
.card{
  width:min(680px,100%);
  display:none;
  flex-direction:column;align-items:center;
  gap:clamp(16px,3.4vw,30px);
  text-align:center;
}
.card.on{display:flex;animation:rise .75s var(--ease) both;}
@keyframes rise{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}

/* 日期 eyebrow */
.dateline{
  margin:0;
  font-family:"GT America Mono","JetBrains Mono","SF Mono",ui-monospace,monospace;
  font-size:11.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
  color:var(--text-muted);
}

.greet{
  margin:0;
  font-family:var(--serif);
  font-size:clamp(30px,7.6vw,50px);
  font-weight:500;
  letter-spacing:-.015em;
  line-height:1.18;
  color:var(--text-primary);
  text-wrap:balance;
}
.greet em{font-style:normal;color:var(--accent);}

.sub{
  margin:0;color:var(--text-secondary);
  font-size:clamp(15px,3.8vw,17px);line-height:1.7;
  max-width:34em;text-wrap:pretty;
}

/* ============ 蛋糕 ============ */
.cake-wrap{position:relative;display:grid;place-items:center;padding-top:clamp(34px,9vw,56px);}
.cake{position:relative;width:clamp(196px,56vw,290px);}

/* 盘子 */
.plate{
  width:120%;height:10px;margin:0 auto;border-radius:50%;
  background:var(--bg-secondary);
  border:1px solid var(--border);
}

.layer{position:relative;margin:0 auto;border-radius:6px;}
.layer::before{ /* 奶油顶 */
  content:"";position:absolute;left:-3%;right:-3%;top:-9px;height:18px;
  border-radius:50%;
  background:var(--cream);
  border-top:1px solid var(--border);
}
.layer::after{ /* 侧面轻微暗部，用渐变做体积但不发光 */
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(90deg,rgba(25,24,23,.16),transparent 30%,rgba(255,255,255,.22) 46%,transparent 72%,rgba(25,24,23,.18));
}
/* 三层高低错开，颜色都落在赤陶—奶油暖色家族里 */
.l1{width:100%;height:clamp(42px,11vw,60px);background:linear-gradient(180deg,#c07a56,var(--choco-d));z-index:3;}
.l2{width:82%;height:clamp(36px,9.6vw,52px);background:linear-gradient(180deg,#d39472,#a05a3c);z-index:2;margin-top:-4px;}
.l3{width:64%;height:clamp(30px,8vw,44px);background:linear-gradient(180deg,#e5b394,#c07a56);z-index:1;margin-top:-4px;}

/* 滴落奶油 */
.drip{
  position:absolute;top:-5px;width:14px;height:14px;border-radius:0 0 50% 50%;
  background:var(--cream);z-index:4;
  box-shadow:0 1px 0 var(--border);
}
.d1{left:14%;height:18px;} .d2{left:38%;height:12px;} .d3{left:60%;height:20px;} .d4{left:82%;height:14px;}

/* 樱桃：赤陶色小圆点，呼应主色 */
.cherry{
  position:absolute;width:12px;height:12px;border-radius:50%;z-index:5;
  background:var(--accent);
  border:1px solid var(--accent-hover);
}
.cherry::after{content:"";position:absolute;left:5px;top:-6px;width:1.5px;height:8px;background:var(--success);border-radius:2px;transform:rotate(16deg);}

/* 蜡烛 */
.candle{
  position:absolute;left:50%;bottom:calc(100% - 5px);transform:translateX(-50%);
  width:13px;height:clamp(48px,13vw,68px);border-radius:3px;
  background:repeating-linear-gradient(135deg,var(--cream) 0 8px,#f0d3c2 8px 16px);
  border:1px solid var(--border);
  z-index:8;
}
.wick{position:absolute;left:50%;top:-7px;transform:translateX(-50%);width:2px;height:8px;background:var(--text-secondary);border-radius:2px;}

/* 火焰：暖橙，是全页第二处也是最后一处高饱和色 */
.flame{
  position:absolute;left:50%;top:-29px;transform:translateX(-50%);
  width:17px;height:31px;border-radius:50% 50% 46% 46%/62% 62% 38% 38%;
  background:radial-gradient(circle at 50% 74%,#fff4d8 0 20%,#f2c078 36%,var(--warning) 62%,rgba(201,138,66,.2) 100%);
  transform-origin:50% 100%;
  animation:flicker 1.6s ease-in-out infinite;
  transition:opacity .35s var(--ease),transform .35s var(--ease);
}
.flame::after{
  content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  width:7px;height:13px;border-radius:50%;
  background:radial-gradient(circle,#fffdf6 0 44%,rgba(255,255,255,0) 100%);
}
@keyframes flicker{
  0%,100%{transform:translateX(-50%) scale(1) rotate(0deg);}
  25%{transform:translateX(-50%) scale(1.05,.95) rotate(-2.5deg);}
  50%{transform:translateX(-50%) scale(.95,1.06) rotate(2deg);}
  75%{transform:translateX(-50%) scale(1.02,.98) rotate(-1.5deg);}
}
/* 光晕：改为极淡的暖色铺底，符合"平铺"原则 */
.glow{
  position:absolute;left:50%;top:-32px;transform:translate(-50%,-50%);
  width:clamp(170px,50vw,270px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(201,138,66,.16) 0%,rgba(201,138,66,.06) 38%,transparent 68%);
  pointer-events:none;transition:opacity .7s var(--ease);z-index:7;
  animation:breathe 3.6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.7;}50%{opacity:1;}}

.cake.out .flame{opacity:0;transform:translateX(-50%) scale(.2);}
.cake.out .glow{opacity:0;animation:none;}

/* 吹灭提示 */
.blow-hint{
  margin:0;color:var(--text-secondary);font-size:clamp(14px,3.6vw,16px);
  line-height:1.7;min-height:1.7em;transition:opacity .3s;max-width:30em;
}
.blow-hint b{color:var(--accent);font-weight:600;}

/* 烟 */
.smoke{
  position:absolute;left:50%;top:-30px;width:8px;height:8px;border-radius:50%;
  background:rgba(90,85,78,.4);pointer-events:none;z-index:9;
}

/* 吹气动效 */
.puff{
  position:fixed;border-radius:50%;pointer-events:none;z-index:60;
  background:radial-gradient(circle,rgba(216,211,200,.55),transparent 70%);
  animation:puffOut .9s ease-out forwards;
}
@keyframes puffOut{from{opacity:.8;transform:scale(.3);}to{opacity:0;transform:scale(2.4);}}

/* 音量条 */
.meter{
  width:min(300px,76vw);height:3px;border-radius:3px;overflow:hidden;
  background:var(--border);opacity:0;transition:opacity .4s;
}
.meter.on{opacity:1;}
.meter i{
  display:block;height:100%;width:0%;border-radius:3px;
  background:var(--accent);
  transition:width .07s linear;
}

/* 吹灭后祝福：Claude 卡片风格（无边框无阴影的浅表面） */
.wish{
  max-width:36em;
  padding:clamp(20px,4.4vw,28px) clamp(20px,4.8vw,32px);
  border-radius:8px;
  background:var(--bg-secondary);
  text-align:left;
}
.wish p{
  margin:0 0 .8em;line-height:1.75;font-size:clamp(15px,3.8vw,17px);
  color:var(--text-secondary);
}
.wish p:last-child{margin-bottom:0;}
.wish p:first-child{color:var(--text-primary);}
.sign{text-align:right;color:var(--accent);font-weight:500;letter-spacing:.02em;}
.hidden{display:none;}

/* 按钮：Claude 主按钮 = 赤陶实心；次按钮 = 1px 边框 */
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.btn{
  padding:10px 20px;border-radius:6px;
  font-size:15px;font-weight:500;letter-spacing:.01em;
  background:var(--accent);color:var(--cream);
  transition:background .2s var(--ease);
}
.btn:hover{background:var(--accent-hover);}
.btn.ghost{
  background:transparent;color:var(--text-primary);
  border:1px solid var(--border);
}
.btn.ghost:hover{background:var(--bg-secondary);}

/* 彩带：限定在暖色家族内 */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
.confetti i{
  position:absolute;top:-14px;width:7px;height:12px;border-radius:1px;opacity:.9;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0deg);}
  100%{transform:translateY(112vh) rotate(700deg);}
}

/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,150%);
  padding:12px 20px;border-radius:6px;
  background:var(--bg-inverse);color:var(--bg-primary);
  font-size:13.5px;line-height:1.5;max-width:90vw;text-align:center;
  transition:transform .38s var(--ease);z-index:80;
}
.toast.on{transform:translate(-50%,0);}

/* 页脚 */
.foot{
  position:fixed;left:0;right:0;bottom:10px;text-align:center;
  font-family:"GT America Mono","SF Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-muted);opacity:.7;z-index:2;pointer-events:none;
}

/* 分隔线（编辑风细节） */
.rule{
  width:44px;height:1px;background:var(--border);margin:0 auto;
  border:0;
}

@media (max-width:640px){
  body{font-size:17px;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  .confetti{display:none;}
}
@media print{
  .sky,.foot,.actions,.hint{display:none;}
  body{background:#fff;}
  .wish{background:#fff;}
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true"></div>

<main class="stage">

  <!-- ===== 封面 ===== -->
  <section class="cover" id="cover" tabindex="0" role="button" aria-label="打开生日贺卡">
    <p class="eyebrow" id="coverDate">2026 · 09 · 28</p>
    <div class="envelope" aria-hidden="true">
      <span class="seal-heart">♥</span>
    </div>
    <h1>致 <em>徐赫</em><br>生日快乐</h1>
    <p class="lede">今天是专属于你的日子。这里有一支蜡烛，等你把它吹灭。</p>
    <p class="hint">轻触打开</p>
  </section>

  <!-- ===== 贺卡 ===== -->
  <section class="card" id="card" aria-live="polite">
    <p class="dateline" id="dateline">2026 · 09 · 28 · Monday</p>
    <h1 class="greet" id="greet">亲爱的 <em>徐赫</em>，生日快乐</h1>
    <p class="sub" id="sub">今天是专属于你的日子，愿所有的好运气都朝你走来。</p>

    <hr class="rule" aria-hidden="true">

    <div class="cake-wrap">
      <div class="cake" id="cake" role="button" tabindex="0" aria-label="生日蛋糕，点击或长按可以吹灭蜡烛">
        <div class="glow" aria-hidden="true"></div>
        <div class="candle" id="candle" aria-label="蜡烛，点击可以吹灭">
          <span class="wick"></span>
          <span class="flame" aria-hidden="true"></span>
        </div>
        <div class="layer l3">
          <span class="cherry" style="left:18%;top:-9px"></span>
          <span class="cherry" style="left:68%;top:-10px"></span>
          <span class="cherry" style="left:44%;top:-8px"></span>
        </div>
        <div class="layer l2">
          <span class="drip d1"></span><span class="drip d2"></span>
          <span class="drip d3"></span><span class="drip d4"></span>
        </div>
        <div class="layer l1"></div>
        <div class="plate" aria-hidden="true"></div>
      </div>
    </div>

    <div class="meter" id="meter" aria-hidden="true"><i id="meterBar"></i></div>
    <p class="blow-hint" id="blowHint">对着麦克风<b>吹一口气</b>，把蜡烛吹灭吧。</p>

    <div class="wish hidden" id="wish">
      <p id="wishText">蜡烛灭了，愿望一定会实现的。</p>
      <p class="sign" id="sign"></p>
    </div>

    <div class="actions" id="actions">
      <button class="btn ghost hidden" id="againBtn" type="button">再点一次蜡烛</button>
      <button class="btn hidden" id="shareBtn" type="button">复制祝福链接</button>
    </div>
  </section>

</main>

<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<p class="foot">Made with ♥ · GitHub Pages</p>

<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };
  var cover = $('cover'), card = $('card'), cake = $('cake'), candle = $('candle');
  var meter = $('meter'), meterBar = $('meterBar'), blowHint = $('blowHint');
  var wish = $('wish'), wishText = $('wishText'), sign = $('sign');
  var againBtn = $('againBtn'), shareBtn = $('shareBtn');
  var confettiBox = $('confetti'), toast = $('toast');

  var blown = false;
  var micReady = false;
  var audioCtx = null, analyser = null, dataArr = null, rafId = null;

  /* ---------- 日期 ---------- */
  var NOW = {
    y: 2026, m: 9, d: 28,
    weekday: 'Monday'
  };
  $('coverDate').textContent = NOW.y + ' · ' + String(NOW.m).padStart(2,'0') + ' · ' + String(NOW.d).padStart(2,'0');
  $('dateline').textContent = NOW.y + ' · ' + String(NOW.m).padStart(2,'0') + ' · ' + String(NOW.d).padStart(2,'0') + ' · ' + NOW.weekday;

  /* ---------- URL 参数（安全写入，不用 innerHTML） ---------- */
  var params = new URLSearchParams(location.search);
  function clean(key, max){
    var v = params.get(key);
    if(!v) return '';
    v = v.replace(/\s+/g,' ').trim().slice(0, max || 40);
    return v;
  }
  // 默认祝贺人：徐赫
  var DEFAULT_TO = '徐赫';
  var TO = clean('to', 24) || DEFAULT_TO;
  var FROM = clean('from', 24);
  var MSG = clean('msg', 120);

  function setGreet(el, name){
    el.textContent = '';
    el.append('亲爱的 ');
    var em = document.createElement('em');
    em.textContent = name;
    el.append(em, '，生日快乐');
  }

  document.title = '生日快乐，' + TO + ' 🎂';
  setGreet($('greet'), TO);
  $('sub').textContent = MSG || '今天是专属于你的日子，愿所有的好运气都朝你走来。';
  wishText.textContent = '蜡烛灭了，' + TO + '，你的愿望一定会实现的。';
  if(FROM){ sign.textContent = '—— ' + FROM; } else { sign.classList.add('hidden'); }

  /* ---------- 提示 ---------- */
  var toastTimer = null;
  function say(text, ms){
    toast.textContent = text;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('on'); }, ms || 3200);
  }

  /* ---------- 轻音效（Web Audio 合成，无外部文件） ---------- */
  function ensureCtx(){
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }
  function beep(freq, dur, type, vol){
    try{
      var ctx = ensureCtx();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(vol || 0.08, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + dur + 0.03);
    }catch(e){/* 静默失败，不影响功能 */}
  }
  function chime(){
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){
      setTimeout(function(){ beep(f, 0.42, 'triangle', 0.06); }, i * 120);
    });
  }
  function puffSound(){
    try{
      var ctx = ensureCtx();
      var len = Math.floor(ctx.sampleRate * 0.35);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i = 0; i < len; i++){
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2) * 0.5;
      }
      var src = ctx.createBufferSource(); src.buffer = buf;
      var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
      var g = ctx.createGain(); g.gain.value = 0.2;
      src.connect(f); f.connect(g); g.connect(ctx.destination);
      src.start();
    }catch(e){}
  }

  /* ---------- 彩带（暖色家族） ---------- */
  function confetti(n){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var colors = ['#c96442','#e89268','#c98a42','#6b7a3d','#d8d3c8','#b55738'];
    var frag = document.createDocumentFragment();
    for(var i = 0; i < (n || 80); i++){
      var p = document.createElement('i');
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.background = colors[(Math.random() * colors.length) | 0];
      var dur = 2.6 + Math.random() * 2.4;
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = (Math.random() * 0.6) + 's';
      if(Math.random() > 0.7){ p.style.borderRadius = '50%'; }
      frag.appendChild(p);
      (function(el){
        setTimeout(function(){ if(el.parentNode){ el.parentNode.removeChild(el); } }, (dur + 0.9) * 1000);
      })(p);
    }
    confettiBox.appendChild(frag);
  }

  /* ---------- 烟雾 ---------- */
  function smoke(){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var rect = candle.getBoundingClientRect();
    for(var i = 0; i < 9; i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement('span');
          s.className = 'smoke';
          s.style.position = 'fixed';
          s.style.left = (rect.left + rect.width / 2 - 4) + 'px';
          s.style.top = (rect.top - 22) + 'px';
          s.style.zIndex = 70;
          var size = 6 + Math.random() * 9;
          s.style.width = size + 'px'; s.style.height = size + 'px';
          document.body.appendChild(s);
          var dx = (Math.random() - 0.5) * 64;
          var anim = s.animate([
            { transform: 'translate(0,0) scale(.5)', opacity: .5 },
            { transform: 'translate(' + dx + 'px,-108px) scale(2)', opacity: 0 }
          ], { duration: 1300 + Math.random() * 700, easing: 'ease-out' });
          anim.onfinish = function(){ s.remove(); };
        }, i * 95);
      })(i);
    }
  }

  /* ---------- 吹灭 ---------- */
  function blowOut(source){
    if(blown) return;
    blown = true;
    cake.classList.add('out');
    puffSound();
    var r = candle.getBoundingClientRect();
    var p = document.createElement('div');
    p.className = 'puff';
    p.style.left = (r.left + r.width / 2 - 60) + 'px';
    p.style.top = (r.top - 40) + 'px';
    p.style.width = p.style.height = '120px';
    document.body.appendChild(p);
    setTimeout(function(){ p.remove(); }, 1000);

    smoke();
    setTimeout(function(){ confetti(90); chime(); }, 320);
    setTimeout(function(){
      wish.classList.remove('hidden');
      againBtn.classList.remove('hidden');
      shareBtn.classList.remove('hidden');
    }, 700);
    blowHint.textContent = source === 'mic' ? '愿望已收到。' : '蜡烛灭了。';
    meter.classList.remove('on');
    stopMic();
    say('🎉 生日快乐，' + TO + '！愿望已经替你收好啦');
  }

  /* ---------- 麦克风 ---------- */
  function stopMic(){
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    if(window.__micStream){
      try{ window.__micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      window.__micStream = null;
    }
  }

  function hintWithBold(prefix, bold, suffix){
    blowHint.textContent = '';
    blowHint.append(prefix);
    var b = document.createElement('b'); b.textContent = bold;
    blowHint.append(b, suffix);
  }

  function initMic(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      blowHint.textContent = '这个浏览器不支持麦克风检测，点一下蜡烛也能吹灭。';
      return;
    }
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).then(function(stream){
      window.__micStream = stream;
      ensureCtx();
      var src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.72;
      src.connect(analyser);
      dataArr = new Uint8Array(analyser.fftSize);
      micReady = true;
      meter.classList.add('on');
      hintWithBold('对着麦克风', '吹一口气', '，把蜡烛吹灭吧。');
      loop();
    }).catch(function(err){
      var denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      blowHint.textContent = denied
        ? '没关系，点一下蜡烛（或长按）也能吹灭。'
        : '没有检测到麦克风，点一下蜡烛也能吹灭。';
    });
  }

  var smooth = 0, hot = 0;
  function loop(){
    if(!micReady || blown){ rafId = null; return; }
    analyser.getByteTimeDomainData(dataArr);
    var sum = 0;
    for(var i = 0; i < dataArr.length; i++){
      var v = (dataArr[i] - 128) / 128;
      sum += v * v;
    }
    var rms = Math.sqrt(sum / dataArr.length);
    smooth = smooth * 0.7 + rms * 0.3;
    var level = Math.min(1, smooth * 3.4);
    meterBar.style.width = (level * 100).toFixed(1) + '%';

    // 吹气 = 持续的中等音量（排除说话/敲击的尖峰）
    if(smooth > 0.055){ hot++; } else { hot = Math.max(0, hot - 2); }
    if(hot >= 6){ blowOut('mic'); return; }

    rafId = requestAnimationFrame(loop);
  }

  /* ---------- 打开贺卡 ---------- */
  function openCard(){
    cover.classList.add('gone');
    setTimeout(function(){
      cover.style.display = 'none';
      card.classList.add('on');
      setTimeout(initMic, 500);
    }, 520);
    beep(660, 0.18, 'sine', 0.05);
    setTimeout(function(){ beep(880, 0.22, 'sine', 0.045); }, 130);
  }
  cover.addEventListener('click', openCard);
  cover.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openCard(); }
  });

  /* ---------- 点击蜡烛兜底 ---------- */
  function manualBlow(e){
    if(e){ e.preventDefault(); }
    blowOut('click');
  }
  candle.addEventListener('click', manualBlow);
  candle.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); manualBlow(e); }
  });
  var pressTimer = null;
  cake.addEventListener('pointerdown', function(){
    if(blown) return;
    pressTimer = setTimeout(manualBlow, 620);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
    cake.addEventListener(ev, function(){ clearTimeout(pressTimer); });
  });
  cake.style.touchAction = 'manipulation';
  cake.style.cursor = 'pointer';

  /* ---------- 再来一次 ---------- */
  againBtn.addEventListener('click', function(){
    blown = false;
    hot = 0; smooth = 0;
    cake.classList.remove('out');
    wish.classList.add('hidden');
    againBtn.classList.add('hidden');
    shareBtn.classList.add('hidden');
    meterBar.style.width = '0%';
    blowHint.textContent = '再吹一次吧。';
    setTimeout(initMic, 300);
  });

  /* ---------- 复制分享链接 ---------- */
  shareBtn.addEventListener('click', function(){
    var url = location.origin + location.pathname + location.search;
    function done(){ say('链接已复制，去发给 TA 吧。'); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){ fallback(url, done); });
    } else { fallback(url, done); }
  });
  function fallback(text, cb){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); cb(); }catch(e){ say('复制失败，请手动复制地址栏链接', 4000); }
    ta.remove();
  }

  /* ---------- 键盘吹气（空格） ---------- */
  document.addEventListener('keydown', function(e){
    if(blown) return;
    if(card.classList.contains('on') && (e.key === ' ' || e.key === 'Spacebar')){
      var tag = (e.target && e.target.tagName) || '';
      if(tag !== 'BUTTON' && tag !== 'INPUT' && tag !== 'TEXTAREA'){ e.preventDefault(); manualBlow(e); }
    }
  });

  // 页面隐藏时暂停音频分析，省电
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ stopMic(); }
    else if(!blown && card.classList.contains('on') && !micReady){ setTimeout(initMic, 400); }
  });
})();
</script>
</body>
</html>
