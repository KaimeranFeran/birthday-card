<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="一张会吹蜡烛的生日贺卡">
<meta name="theme-color" content="#0b0a1e">
<title>生日快乐 🎂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<style>
/* ============ 基础 ============ */
:root{
  --bg-0:#07061a;
  --bg-1:#141034;
  --bg-2:#2a1a4a;
  --gold:#ffd88a;
  --gold-2:#ffb347;
  --rose:#ff8fab;
  --cream:#fff3d6;
  --choco:#7b4a2d;
  --choco-d:#5a3320;
  --text:#f6efe4;
  --dim:#b8aecd;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
  background:var(--bg-0);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px;}

/* ============ 星空背景 ============ */
.sky{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(1200px 700px at 50% 110%, #3b2359 0%, transparent 62%),
    radial-gradient(900px 600px at 12% 8%, #1e2050 0%, transparent 60%),
    radial-gradient(900px 600px at 88% 14%, #3a1f45 0%, transparent 60%),
    linear-gradient(180deg,var(--bg-0) 0%,var(--bg-1) 55%,var(--bg-2) 100%);
}
.sky::after{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(1.6px 1.6px at 20% 30%, #fff 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 70% 18%, #fff 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 40% 72%, #fff 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 86% 62%, #fff 50%, transparent 51%),
    radial-gradient(1.1px 1.1px at 12% 84%, #fff 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 58% 44%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 33% 12%, #fff 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 92% 88%, #fff 50%, transparent 51%);
  opacity:.55;
  animation:twinkle 5.5s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.28;}to{opacity:.72;}}

/* ============ 布局 ============ */
.stage{
  position:relative;z-index:1;
  min-height:100dvh;
  display:grid;place-items:center;
  padding:clamp(16px,4vw,48px);
}

/* ============ 封面 ============ */
.cover{
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:clamp(18px,4vw,32px);
  transition:opacity .55s var(--ease),transform .55s var(--ease);
}
.cover.gone{opacity:0;transform:scale(.9) translateY(-24px);pointer-events:none;}

.envelope{
  width:clamp(190px,52vw,300px);
  aspect-ratio:3/2;
  position:relative;
  border-radius:14px;
  background:linear-gradient(160deg,#fdf4e0,#f3d9a8);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.18) inset;
  animation:float 4.2s ease-in-out infinite;
  transform-origin:center;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg);}50%{transform:translateY(-14px) rotate(1.2deg);}}
.envelope::before{ /* 信封下摆 */
  content:"";position:absolute;inset:0;
  border-radius:14px;
  background:linear-gradient(200deg,transparent 44%,#e8c78d 45%);
  clip-path:polygon(0 100%,50% 52%,100% 100%);
}
.envelope::after{ /* 火漆印 */
  content:"❤";position:absolute;left:50%;top:52%;
  transform:translate(-50%,-50%);
  width:clamp(44px,12vw,62px);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;
  font-size:clamp(20px,5vw,28px);color:#7a1e35;
  background:radial-gradient(circle at 35% 30%,#ff8e9c,#c9304f 70%);
  box-shadow:0 6px 16px rgba(0,0,0,.4),0 0 0 4px rgba(255,255,255,.22);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.1);}}

.cover h1{
  margin:0;font-size:clamp(26px,7vw,46px);font-weight:800;letter-spacing:.06em;
  background:linear-gradient(100deg,var(--gold) 10%,#fff 40%,var(--rose) 75%,var(--gold-2));
  background-size:220% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 5s linear infinite;
}
@keyframes shine{to{background-position:220% center;}}
.hint{color:var(--dim);font-size:clamp(13px,3.4vw,16px);letter-spacing:.16em;margin:0;}
.hint span{display:inline-block;animation:bob 1.9s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.6;}50%{transform:translateY(-5px);opacity:1;}}

/* ============ 贺卡主体 ============ */
.card{
  width:min(760px,100%);
  display:none;
  flex-direction:column;align-items:center;
  gap:clamp(12px,3vw,26px);
  text-align:center;
}
.card.on{display:flex;animation:rise .8s var(--ease) both;}
@keyframes rise{from{opacity:0;transform:translateY(38px) scale(.97);}to{opacity:1;transform:none;}}

.greet{
  margin:0;font-size:clamp(24px,6.4vw,44px);font-weight:800;line-height:1.24;
  letter-spacing:.02em;
  background:linear-gradient(96deg,var(--gold) 0%,#fff 45%,var(--rose) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.to-name{color:var(--gold);font-weight:900;}
.sub{margin:0;color:var(--dim);font-size:clamp(13px,3.5vw,17px);line-height:1.8;max-width:34em;}

/* ============ 蛋糕 ============ */
.cake-wrap{position:relative;display:grid;place-items:center;padding-top:clamp(30px,8vw,54px);}
.cake{position:relative;width:clamp(190px,54vw,280px);--u:calc(min(190px + 90 * (100vw - 320px) / 720, 280px) / 280);}
.cake{--u:1;}

/* 盘子 */
.plate{
  width:118%;height:16px;margin:0 auto;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(190,190,220,.35));
  box-shadow:0 16px 34px -10px rgba(0,0,0,.7);
}

.layer{position:relative;margin:0 auto;border-radius:10px 10px 8px 8px;}
.layer::before{ /* 奶油顶 */
  content:"";position:absolute;left:-4%;right:-4%;top:-11px;height:22px;
  border-radius:50%;
  background:var(--cream);
  box-shadow:0 2px 0 rgba(0,0,0,.08) inset;
}
.layer::after{ /* 侧面光泽 */
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(90deg,rgba(0,0,0,.3),transparent 26%,rgba(255,255,255,.16) 40%,transparent 70%,rgba(0,0,0,.34));
}
.l1{width:100%;height:clamp(40px,11vw,58px);background:linear-gradient(180deg,#8d5735,var(--choco-d));z-index:3;}
.l2{width:82%;height:clamp(34px,9.4vw,50px);background:linear-gradient(180deg,#a3673f,#68402a);z-index:2;margin-top:-4px;}
.l3{width:64%;height:clamp(28px,7.8vw,42px);background:linear-gradient(180deg,#b87a4c,#7b4a2d);z-index:1;margin-top:-4px;}

/* 滴落奶油 */
.drip{
  position:absolute;top:-6px;width:16px;height:16px;border-radius:0 0 50% 50%;
  background:var(--cream);z-index:4;
}
.d1{left:14%;height:20px;} .d2{left:38%;height:13px;} .d3{left:60%;height:22px;} .d4{left:82%;height:15px;}

/* 樱桃 */
.cherry{
  position:absolute;width:13px;height:13px;border-radius:50%;z-index:5;
  background:radial-gradient(circle at 32% 28%,#ff7a8f,#c01f3c 70%);
  box-shadow:0 2px 5px rgba(0,0,0,.4);
}
.cherry::after{content:"";position:absolute;left:6px;top:-6px;width:2px;height:8px;background:#4c8a3f;transform:rotate(16deg);border-radius:2px;}

/* 蜡烛 */
.candle{
  position:absolute;left:50%;bottom:calc(100% - 6px);transform:translateX(-50%);
  width:14px;height:clamp(46px,13vw,66px);border-radius:4px;
  background:repeating-linear-gradient(135deg,#fff 0 8px,#ffd0dc 8px 16px);
  box-shadow:0 0 0 1px rgba(0,0,0,.12),inset -3px 0 0 rgba(0,0,0,.14);
  z-index:8;
}
.wick{position:absolute;left:50%;top:-7px;transform:translateX(-50%);width:2.5px;height:8px;background:#3a3128;border-radius:2px;}

/* 火焰 */
.flame{
  position:absolute;left:50%;top:-30px;transform:translateX(-50%);
  width:19px;height:34px;border-radius:50% 50% 46% 46%/62% 62% 38% 38%;
  background:radial-gradient(circle at 50% 72%,#fff8d0 0 18%,#ffd452 34%,#ff9420 66%,rgba(255,96,0,.18) 100%);
  filter:blur(.4px);
  transform-origin:50% 100%;
  animation:flicker 1.5s ease-in-out infinite;
  transition:opacity .35s var(--ease),transform .35s var(--ease);
}
.flame::after{ /* 内焰 */
  content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  width:8px;height:15px;border-radius:50%;
  background:radial-gradient(circle,#fff 0 40%,rgba(255,255,255,0) 100%);
}
@keyframes flicker{
  0%,100%{transform:translateX(-50%) scale(1) rotate(0deg);}
  25%{transform:translateX(-50%) scale(1.06,.94) rotate(-3deg);}
  50%{transform:translateX(-50%) scale(.94,1.08) rotate(2deg);}
  75%{transform:translateX(-50%) scale(1.03,.97) rotate(-2deg);}
}
/* 光晕 */
.glow{
  position:absolute;left:50%;top:-34px;transform:translate(-50%,-50%);
  width:clamp(160px,48vw,260px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,196,90,.34) 0%,rgba(255,150,40,.14) 36%,transparent 68%);
  pointer-events:none;transition:opacity .7s var(--ease);z-index:7;
  animation:breathe 3.4s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.75;}50%{opacity:1;}}

.cake.out .flame{opacity:0;transform:translateX(-50%) scale(.2);}
.cake.out .glow{opacity:0;animation:none;}

/* 吹灭提示 */
.blow-hint{
  margin:0;color:var(--dim);font-size:clamp(13px,3.5vw,16px);letter-spacing:.06em;
  min-height:1.6em;transition:opacity .3s;
}
.blow-hint b{color:var(--gold);font-weight:700;}

/* 烟 */
.smoke{position:absolute;left:50%;top:-30px;width:8px;height:8px;border-radius:50%;background:rgba(220,220,235,.55);pointer-events:none;z-index:9;}

/* 吹气动效 */
.puff{
  position:fixed;border-radius:50%;pointer-events:none;z-index:60;
  background:radial-gradient(circle,rgba(255,255,255,.5),transparent 70%);
  animation:puffOut .9s ease-out forwards;
}
@keyframes puffOut{from{opacity:.85;transform:scale(.3);}to{opacity:0;transform:scale(2.6);}}

/* 音量条 */
.meter{
  width:min(300px,76vw);height:6px;border-radius:6px;overflow:hidden;
  background:rgba(255,255,255,.12);opacity:0;transition:opacity .4s;
}
.meter.on{opacity:1;}
.meter i{
  display:block;height:100%;width:0%;border-radius:6px;
  background:linear-gradient(90deg,#63d2ff,#ffd452,#ff6b6b);
  transition:width .07s linear;
}

/* 吹灭后祝福 */
.wish{
  max-width:36em;padding:clamp(16px,4vw,26px) clamp(16px,4.5vw,30px);
  border-radius:18px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,216,138,.24);
  backdrop-filter:blur(8px);
  box-shadow:0 20px 50px -24px rgba(0,0,0,.8);
}
.wish p{margin:0 0 .7em;line-height:2;font-size:clamp(14px,3.8vw,17px);color:#efe7db;}
.wish p:last-child{margin-bottom:0;}
.sign{text-align:right;color:var(--gold);font-weight:700;letter-spacing:.05em;}
.hidden{display:none;}

/* 按钮 */
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.btn{
  padding:11px 22px;border-radius:999px;font-size:clamp(13px,3.6vw,15px);font-weight:600;
  letter-spacing:.04em;
  background:linear-gradient(96deg,var(--gold-2),var(--rose));
  color:#2a1020;
  box-shadow:0 12px 26px -12px rgba(255,140,180,.85);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),filter .22s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 16px 30px -12px rgba(255,140,180,1);}
.btn:active{transform:translateY(0);}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--text);box-shadow:none;border:1px solid rgba(255,255,255,.2);}
.btn.ghost:hover{background:rgba(255,255,255,.17);}

/* 彩带 */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
.confetti i{
  position:absolute;top:-14px;width:9px;height:15px;border-radius:2px;opacity:.95;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0deg);}
  100%{transform:translateY(112vh) rotate(760deg);}
}

/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);
  padding:11px 20px;border-radius:999px;
  background:rgba(18,14,36,.92);border:1px solid rgba(255,255,255,.16);
  color:var(--text);font-size:13.5px;line-height:1.5;max-width:90vw;text-align:center;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.9);
  transition:transform .38s var(--ease);z-index:80;
}
.toast.on{transform:translate(-50%,0);}

/* 页脚 */
.foot{
  position:fixed;left:0;right:0;bottom:8px;text-align:center;
  font-size:11.5px;color:rgba(184,174,205,.5);letter-spacing:.08em;z-index:2;pointer-events:none;
}

@media (max-width:420px){
  .greet{letter-spacing:0;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  .confetti{display:none;}
}
@media print{.sky,.foot,.actions{display:none;}body{background:#fff;color:#000;}}
</style>
</head>
<body>

<div class="sky" aria-hidden="true"></div>

<main class="stage">

  <!-- ===== 封面 ===== -->
  <section class="cover" id="cover">
    <div class="envelope" aria-hidden="true"></div>
    <h1>生日快乐</h1>
    <p class="hint">轻触屏幕打开<span>·</span></p>
  </section>

  <!-- ===== 贺卡 ===== -->
  <section class="card" id="card" aria-live="polite">
    <h1 class="greet" id="greet">Happy Birthday</h1>
    <p class="sub" id="sub">今天是专属于你的日子，愿所有的好运气都朝你走来。</p>

    <div class="cake-wrap">
      <div class="cake" id="cake">
        <div class="glow" aria-hidden="true"></div>
        <div class="candle" id="candle" role="button" tabindex="0" aria-label="蜡烛，点击可以吹灭">
          <span class="wick"></span>
          <span class="flame" aria-hidden="true"></span>
        </div>
        <div class="layer l3">
          <span class="cherry" style="left:18%;top:-10px"></span>
          <span class="cherry" style="left:68%;top:-11px"></span>
          <span class="cherry" style="left:44%;top:-9px"></span>
        </div>
        <div class="layer l2">
          <span class="drip d1"></span><span class="drip d2"></span>
          <span class="drip d3"></span><span class="drip d4"></span>
        </div>
        <div class="layer l1"></div>
        <div class="plate" aria-hidden="true"></div>
      </div>
    </div>

    <div class="meter" id="meter" aria-hidden="true"><i id="meterBar"></i></div>
    <p class="blow-hint" id="blowHint">对着麦克风<b>吹一口气</b>，把蜡烛吹灭吧 🕯️</p>

    <div class="wish hidden" id="wish">
      <p id="wishText">蜡烛灭了，愿望一定会实现的。</p>
      <p class="sign" id="sign"></p>
    </div>

    <div class="actions" id="actions">
      <button class="btn ghost hidden" id="againBtn" type="button">再点一次蜡烛</button>
      <button class="btn hidden" id="shareBtn" type="button">复制祝福链接</button>
    </div>
  </section>

</main>

<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>
<p class="foot">Made with ♥ · GitHub Pages</p>

<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };
  var cover = $('cover'), card = $('card'), cake = $('cake'), candle = $('candle');
  var meter = $('meter'), meterBar = $('meterBar'), blowHint = $('blowHint');
  var wish = $('wish'), wishText = $('wishText'), sign = $('sign');
  var actions = $('actions'), againBtn = $('againBtn'), shareBtn = $('shareBtn');
  var confettiBox = $('confetti'), toast = $('toast');

  var blown = false;
  var micReady = false;
  var audioCtx = null, analyser = null, dataArr = null, rafId = null;

  /* ---------- URL 参数（安全写入，不用 innerHTML） ---------- */
  var params = new URLSearchParams(location.search);
  function clean(key, max){
    var v = params.get(key);
    if(!v) return '';
    v = v.replace(/\s+/g,' ').trim().slice(0, max || 40);
    return v;
  }
  var TO = clean('to', 24), FROM = clean('from', 24), MSG = clean('msg', 120);

  document.title = TO ? '生日快乐，' + TO + ' 🎂' : '生日快乐 🎂';
  $('greet').textContent = TO ? '亲爱的 ' + TO + '，生日快乐' : 'Happy Birthday';
  $('sub').textContent = MSG || '今天是专属于你的日子，愿所有的好运气都朝你走来。';
  wishText.textContent = TO
    ? '蜡烛灭了，' + TO + '，你的愿望一定会实现的。'
    : '蜡烛灭了，愿望一定会实现的。';
  if(FROM){ sign.textContent = '—— ' + FROM; } else { sign.classList.add('hidden'); }

  /* ---------- 提示 ---------- */
  var toastTimer = null;
  function say(text, ms){
    toast.textContent = text;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('on'); }, ms || 3200);
  }

  /* ---------- 轻音效（Web Audio 合成，无外部文件） ---------- */
  function beep(freq, dur, type, vol){
    try{
      if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(vol || 0.1, audioCtx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur + 0.03);
    }catch(e){/* 静默失败，不影响功能 */}
  }
  function chime(){
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){
      setTimeout(function(){ beep(f, 0.42, 'triangle', 0.07); }, i * 115);
    });
  }
  function puffSound(){
    try{
      if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
      var len = Math.floor(audioCtx.sampleRate * 0.35);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i = 0; i < len; i++){
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2) * 0.5;
      }
      var src = audioCtx.createBufferSource(); src.buffer = buf;
      var f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
      var g = audioCtx.createGain(); g.gain.value = 0.24;
      src.connect(f); f.connect(g); g.connect(audioCtx.destination);
      src.start();
    }catch(e){}
  }

  /* ---------- 彩带 ---------- */
  function confetti(n){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var colors = ['#ffd452','#ff8fab','#63d2ff','#b98cff','#7ee787','#ffb347','#fff3d6'];
    var frag = document.createDocumentFragment();
    for(var i = 0; i < (n || 90); i++){
      var p = document.createElement('i');
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.background = colors[(Math.random() * colors.length) | 0];
      var dur = 2.6 + Math.random() * 2.6;
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = (Math.random() * 0.7) + 's';
      p.style.width = (6 + Math.random() * 6) + 'px';
      p.style.height = (9 + Math.random() * 11) + 'px';
      if(Math.random() > 0.65){ p.style.borderRadius = '50%'; }
      frag.appendChild(p);
      (function(el){
        setTimeout(function(){ if(el.parentNode){ el.parentNode.removeChild(el); } }, (dur + 0.9) * 1000);
      })(p);
    }
    confettiBox.appendChild(frag);
  }

  /* ---------- 烟雾 ---------- */
  function smoke(){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var rect = candle.getBoundingClientRect();
    for(var i = 0; i < 9; i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement('span');
          s.className = 'smoke';
          s.style.position = 'fixed';
          s.style.left = (rect.left + rect.width / 2 - 4) + 'px';
          s.style.top = (rect.top - 24) + 'px';
          s.style.zIndex = 70;
          var size = 6 + Math.random() * 10;
          s.style.width = size + 'px'; s.style.height = size + 'px';
          document.body.appendChild(s);
          var dx = (Math.random() - 0.5) * 70;
          var anim = s.animate([
            { transform: 'translate(0,0) scale(.5)', opacity: .6 },
            { transform: 'translate(' + dx + 'px,-110px) scale(2.1)', opacity: 0 }
          ], { duration: 1300 + Math.random() * 800, easing: 'ease-out' });
          anim.onfinish = function(){ s.remove(); };
        }, i * 95);
      })(i);
    }
  }

  /* ---------- 吹灭 ---------- */
  function blowOut(source){
    if(blown) return;
    blown = true;
    cake.classList.add('out');
    puffSound();
    var r = candle.getBoundingClientRect();
    var p = document.createElement('div');
    p.className = 'puff';
    p.style.left = (r.left + r.width / 2 - 60) + 'px';
    p.style.top = (r.top - 40) + 'px';
    p.style.width = p.style.height = '120px';
    document.body.appendChild(p);
    setTimeout(function(){ p.remove(); }, 1000);

    smoke();
    setTimeout(function(){ confetti(110); chime(); }, 320);
    setTimeout(function(){
      wish.classList.remove('hidden');
      againBtn.classList.remove('hidden');
      shareBtn.classList.remove('hidden');
    }, 700);
    blowHint.textContent = source === 'mic' ? '愿望已收到 ✨' : '蜡烛灭了 ✨';
    meter.classList.remove('on');
    stopMic();
    say('🎉 生日快乐！愿望已经替你收好啦');
  }

  /* ---------- 麦克风 ---------- */
  function stopMic(){
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    if(window.__micStream){
      try{ window.__micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      window.__micStream = null;
    }
  }

  function initMic(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      blowHint.textContent = '这个浏览器不支持麦克风检测，点一下蜡烛也能吹灭 👆';
      return;
    }
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).then(function(stream){
      window.__micStream = stream;
      if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      var src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.72;
      src.connect(analyser);
      dataArr = new Uint8Array(analyser.fftSize);
      micReady = true;
      meter.classList.add('on');
      blowHint.innerHTML = '';
      blowHint.append('对着麦克风');
      var b = document.createElement('b'); b.textContent = '吹一口气';
      blowHint.append(b, '，把蜡烛吹灭吧 🕯️');
      loop();
    }).catch(function(err){
      var denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      blowHint.textContent = denied
        ? '没关系，点一下蜡烛（或长按）也能吹灭 👆'
        : '没有检测到麦克风，点一下蜡烛也能吹灭 👆';
    });
  }

  var smooth = 0, hot = 0;
  function loop(){
    if(!micReady || blown){ rafId = null; return; }
    analyser.getByteTimeDomainData(dataArr);
    var sum = 0;
    for(var i = 0; i < dataArr.length; i++){
      var v = (dataArr[i] - 128) / 128;
      sum += v * v;
    }
    var rms = Math.sqrt(sum / dataArr.length);
    smooth = smooth * 0.7 + rms * 0.3;
    var level = Math.min(1, smooth * 3.4);
    meterBar.style.width = (level * 100).toFixed(1) + '%';

    // 吹气 = 持续的中等音量（排除说话/敲击的尖峰）
    if(smooth > 0.055){ hot++; } else { hot = Math.max(0, hot - 2); }
    if(hot >= 6){ blowOut('mic'); return; }

    rafId = requestAnimationFrame(loop);
  }

  /* ---------- 打开贺卡 ---------- */
  function openCard(){
    cover.classList.add('gone');
    setTimeout(function(){
      cover.style.display = 'none';
      card.classList.add('on');
      setTimeout(initMic, 500);
    }, 520);
    beep(660, 0.18, 'sine', 0.06);
    setTimeout(function(){ beep(880, 0.22, 'sine', 0.05); }, 130);
  }
  cover.addEventListener('click', openCard);
  cover.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openCard(); }
  });
  cover.setAttribute('tabindex', '0');
  cover.setAttribute('role', 'button');

  /* ---------- 点击蜡烛兜底 ---------- */
  function manualBlow(e){
    if(e){ e.preventDefault(); }
    blowOut('click');
  }
  candle.addEventListener('click', manualBlow);
  candle.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); manualBlow(e); }
  });
  // 长按蛋糕也能吹
  var pressTimer = null;
  cake.addEventListener('pointerdown', function(){
    if(blown) return;
    pressTimer = setTimeout(manualBlow, 620);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
    cake.addEventListener(ev, function(){ clearTimeout(pressTimer); });
  });
  cake.style.touchAction = 'manipulation';
  cake.style.cursor = 'pointer';
  cake.setAttribute('aria-label', '生日蛋糕，点击或长按可以吹灭蜡烛');

  /* ---------- 再来一次 ---------- */
  againBtn.addEventListener('click', function(){
    blown = false;
    hot = 0; smooth = 0;
    cake.classList.remove('out');
    wish.classList.add('hidden');
    againBtn.classList.add('hidden');
    shareBtn.classList.add('hidden');
    meterBar.style.width = '0%';
    blowHint.textContent = '再吹一次吧 🕯️';
    setTimeout(initMic, 300);
  });

  /* ---------- 复制分享链接 ---------- */
  shareBtn.addEventListener('click', function(){
    var url = location.origin + location.pathname + location.search;
    function done(){ say('链接已复制，去发给 TA 吧 💌'); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){ fallback(url, done); });
    } else { fallback(url, done); }
  });
  function fallback(text, cb){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); cb(); }catch(e){ say('复制失败，请手动复制地址栏链接', 4000); }
    ta.remove();
  }

  /* ---------- 键盘吹气（空格） ---------- */
  document.addEventListener('keydown', function(e){
    if(blown) return;
    if(card.classList.contains('on') && (e.key === ' ' || e.key === 'Spacebar')){
      var tag = (e.target && e.target.tagName) || '';
      if(tag !== 'BUTTON' && tag !== 'INPUT' && tag !== 'TEXTAREA'){ e.preventDefault(); manualBlow(e); }
    }
  });

  // 页面隐藏时暂停音频分析，省电
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ stopMic(); }
    else if(!blown && card.classList.contains('on') && !micReady){ setTimeout(initMic, 400); }
  });
})();
</script>
</body>
</html>
