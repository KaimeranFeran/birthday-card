<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f3ee">
<title>页面走丢了 🎈</title>
<style>
/* Claude 风格：奶油纸底 + 赤陶点睛 + 衬线标题 */
:root{
  --bg-primary:#f4f3ee;
  --bg-secondary:#eeede6;
  --text-primary:#191817;
  --text-secondary:#5a554e;
  --text-muted:#8a847a;
  --accent:#c96442;
  --accent-hover:#b55738;
  --border:#d8d3c8;
  --serif:"Tiempos Headline","Iowan Old Style","Songti SC","Source Han Serif SC","Noto Serif SC",Georgia,serif;
  --sans:"Styrene A",Inter,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px;
  font-family:var(--sans);font-size:17px;line-height:1.6;color:var(--text-primary);
  background:var(--bg-primary);text-align:center;
}
.box{max-width:520px;}
.eyebrow{
  margin:0 0 22px;font-family:"GT America Mono","SF Mono",ui-monospace,monospace;
  font-size:11.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
  color:var(--text-muted);
}
.mark{
  width:clamp(72px,20vw,104px);aspect-ratio:1;margin:0 auto 26px;
  border-radius:50%;background:var(--accent);
  display:grid;place-items:center;
  color:var(--bg-primary);font-size:clamp(30px,8vw,42px);line-height:1;
  animation:float 3.8s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
h1{
  margin:0 0 14px;font-family:var(--serif);font-weight:500;
  font-size:clamp(28px,7vw,42px);letter-spacing:-.015em;line-height:1.2;
  text-wrap:balance;
}
h1 em{font-style:normal;color:var(--accent);}
p.lede{margin:0 0 30px;color:var(--text-secondary);text-wrap:pretty;}
a{
  display:inline-block;padding:10px 20px;border-radius:6px;text-decoration:none;
  font-size:15px;font-weight:500;
  background:var(--accent);color:#f4f3ee;
  transition:background .2s cubic-bezier(.22,.61,.36,1);
}
a:hover{background:var(--accent-hover);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
hr{border:0;width:44px;height:1px;background:var(--border);margin:0 auto;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
  <div class="box">
    <p class="eyebrow">Error 404</p>
    <div class="mark" aria-hidden="true">🎈</div>
    <h1>这个页面<em>飘走了</em></h1>
    <p class="lede">你要找的地址不存在，也许链接少了一个字母。<br>回到贺卡首页看看？</p>
    <hr>
    <p style="height:26px"></p>
    <a href="./">回到首页</a>
  </div>
</body>
</html>
