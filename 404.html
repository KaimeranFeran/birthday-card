<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面走丢了 🎈</title>
<style>
:root{--gold:#ffd88a;--rose:#ff8fab;}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#f6efe4;
  background:
    radial-gradient(900px 600px at 50% 110%,#3b2359 0%,transparent 62%),
    linear-gradient(180deg,#07061a,#141034 55%,#2a1a4a);
  text-align:center;
}
.box{max-width:520px;}
.emoji{font-size:clamp(52px,16vw,96px);line-height:1;animation:float 3.4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
h1{margin:18px 0 8px;font-size:clamp(22px,6vw,34px);
  background:linear-gradient(96deg,var(--gold),#fff 45%,var(--rose));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
p{margin:0 0 22px;color:#b8aecd;line-height:1.9;font-size:clamp(13px,3.6vw,16px);}
a{
  display:inline-block;padding:11px 24px;border-radius:999px;text-decoration:none;
  font-weight:700;color:#2a1020;
  background:linear-gradient(96deg,#ffb347,var(--rose));
  box-shadow:0 12px 26px -12px rgba(255,140,180,.85);
  transition:transform .22s ease;
}
a:hover{transform:translateY(-2px);}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
  <div class="box">
    <div class="emoji">🎈</div>
    <h1>这个页面飘走了</h1>
    <p>你要找的地址不存在，也许链接少了一个字母。<br>回到贺卡首页看看？</p>
    <a href="./">回到首页</a>
  </div>
</body>
</html>
